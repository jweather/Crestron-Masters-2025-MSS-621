<html>
<head>
    <title>Configure Global Sources</title>
    <link href="bootstrap.css" rel="stylesheet" />
</head>

<body>

    <h1>Configure Global Sources</h1>

    <p>Enter source names and multicast IP addresses:</p>
    <table id="sources" class="table table-bordered" width="60%">
        <tr>
            <th>Name</th>
            <th>IP</th>
            <th>&nbsp;</th>
        </tr>

        <tr class="btnRow">
            <td>
                <input type="text" id="addName" />
            </td>
            <td>
                <input type="text" id="addIP" />
            </td>
            <td>
                <button type="button" id="btnAdd" class="btn btn-primary">Add</button>
            </td>
        </tr>
    </table>


    <script src="jquery.js"></script>
    <script src="index.js"></script>

</body>

</html>
